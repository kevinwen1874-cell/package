<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FAF5EB">
<title>丸俠集卡 · 大埔振興肉丸</title>
<style>
  :root{
    --red:#E32412;
    --red-dk:#B81709;
    --gold:#A87E40;
    --ink:#221713;
    --paper:#FAF5EB;
    --white:#FBFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--paper);
    background-image:radial-gradient(rgba(34,23,19,.055) 1px, transparent 1px);
    background-size:14px 14px;
    color:var(--ink);
    font-family:"PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    overflow:hidden;
  }
  #stage{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}

  .screen{display:none;min-height:100%;padding:calc(env(safe-area-inset-top) + 26px) 20px calc(env(safe-area-inset-bottom) + 24px);}
  .screen.on{display:flex;flex-direction:column;}
  .wrap{width:100%;max-width:430px;margin:auto;}

  /* ---------- 品牌頭 ---------- */
  .brand{text-align:center;margin-bottom:20px;}
  .brand-mascot{width:172px;max-width:52vw;display:block;margin:0 auto 6px;filter:drop-shadow(0 8px 10px rgba(34,23,19,.16));}
  .brand h1{
    margin:0;font-size:clamp(30px,9vw,38px);font-weight:900;letter-spacing:.2em;
    text-indent:.2em;line-height:1.1;
  }
  .brand .sub{
    margin-top:9px;font-size:11.5px;font-weight:800;letter-spacing:.28em;color:var(--gold);
    text-indent:.28em;
  }

  /* ---------- 表單面板 ---------- */
  .panel{
    background:var(--white);border:3px solid var(--ink);border-radius:22px;
    box-shadow:0 7px 0 var(--ink);padding:20px 18px 18px;
  }
  .panel-title{
    margin:0 0 16px;font-size:17px;font-weight:900;letter-spacing:.22em;text-indent:.22em;
    text-align:center;color:var(--ink);
  }
  .panel-title::after{
    content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--red);
    margin:9px auto 0;
  }

  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;font-weight:900;letter-spacing:.14em;color:#7d706a;margin:0 0 6px 3px;}
  .field input{
    width:100%;padding:13px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;
    font:inherit;font-size:16px;font-weight:800;color:var(--ink);outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  .field input::placeholder{color:#c0b4ae;font-weight:700;}
  .field input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(227,36,18,.11);}

  .code-row{display:flex;gap:9px;align-items:stretch;}
  .code-row input{flex:1 1 auto;min-width:0;letter-spacing:.18em;}
  .code-btn{
    flex:0 0 auto;padding:0 15px;border:3px solid var(--ink);border-radius:14px;background:var(--white);
    font:inherit;font-size:13px;font-weight:900;letter-spacing:.06em;color:var(--red);cursor:pointer;
    white-space:nowrap;transition:transform .1s,background .15s,color .15s;
  }
  .code-btn:active{transform:translateY(2px);}
  .code-btn[disabled]{background:#EFE7DC;color:#a79b94;border-color:rgba(34,23,19,.35);cursor:default;}
  .code-hint{
    margin:7px 1px 0;font-size:11px;font-weight:800;line-height:1.5;letter-spacing:.02em;
    color:var(--gold);display:none;
  }
  .code-hint.on{display:block;}

  .autonote{
    margin:4px 2px 13px;font-size:11px;font-weight:800;line-height:1.65;letter-spacing:.02em;
    color:#9a8d86;text-align:center;
  }

  .btn{
    width:100%;padding:15px;margin-top:0;border:3px solid var(--ink);border-radius:16px;
    background:var(--red);color:#fff;font:inherit;font-size:17px;font-weight:900;letter-spacing:.14em;
    box-shadow:0 6px 0 var(--ink);cursor:pointer;
    transition:transform .1s,box-shadow .1s,background .15s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink);}
  .btn[disabled]{background:#c9bdb7;box-shadow:0 4px 0 var(--ink);cursor:default;}

  .msg{
    margin:12px 2px 0;font-size:13px;font-weight:800;line-height:1.5;border-radius:10px;
    padding:9px 11px;display:none;
  }
  .msg.on{display:block;}
  .msg.err{background:#FDE8E5;color:#B81709;border:2px solid #F3BDB6;}
  .msg.ok{background:#E8F6EC;color:#1D7B3E;border:2px solid #B8E0C4;}

  .fineprint{margin:18px 0 0;text-align:center;font-size:11px;line-height:1.7;color:#9a8d86;font-weight:700;letter-spacing:.03em;}

  /* ---------- 主界面 ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .topbar .t{font-size:17px;font-weight:900;letter-spacing:.15em;}
  .who{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.06em;margin-top:3px;}
  .ghost{
    padding:9px 14px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;
    font:inherit;font-size:12.5px;font-weight:900;letter-spacing:.1em;color:var(--ink);cursor:pointer;
  }
  .ghost:active{transform:translateY(2px);}

  .sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:0 3px 11px;}
  .sec-title h2{margin:0;font-size:15px;font-weight:900;letter-spacing:.16em;}
  .sec-title span{font-size:12px;font-weight:900;color:var(--red);letter-spacing:.05em;}

  .album{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .slot{position:relative;aspect-ratio:900/1040;border-radius:15px;overflow:hidden;background:#fff;}
  .slot.got{border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);}
  .slot.got img{width:100%;height:100%;object-fit:cover;display:block;}
  .slot.empty{
    border:3px dashed rgba(34,23,19,.26);background:rgba(255,255,255,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  }
  .slot.empty b{font-size:38px;font-weight:900;color:rgba(34,23,19,.155);line-height:1;letter-spacing:.02em;}
  .slot.empty i{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.16em;color:rgba(34,23,19,.28);}

  /* 隱藏款卡位：獨佔一行，深底斜紋 + 描金標籤 */
  .slot.locked{
    grid-column:1 / -1;aspect-ratio:900/380;border:3px solid var(--ink);border-radius:15px;
    box-shadow:0 5px 0 var(--ink);overflow:hidden;position:relative;
    background:repeating-linear-gradient(45deg,#2A1E19 0 9px,#332520 9px 18px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  }
  .slot.locked b{font-size:58px;font-weight:900;line-height:1;color:rgba(255,206,120,.34);letter-spacing:.04em;}
  .lk-tag{
    position:absolute;top:9px;left:9px;padding:3px 10px;border-radius:10px;background:var(--gold);
    color:#fff;font-size:10px;font-weight:900;letter-spacing:.16em;text-indent:.16em;border:2px solid var(--ink);
  }
  .slot.got.wide{grid-column:1 / -1;aspect-ratio:900/380;}
  .slot.got.wide img{object-fit:cover;}
  .slot .num{
    position:absolute;top:7px;right:7px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;
    background:var(--red);border:2.5px solid var(--ink);color:#fff;font-size:12px;font-weight:900;
    display:grid;place-items:center;
  }
  .cardname{margin:7px 2px 0;font-size:11.5px;font-weight:800;color:#7d706a;letter-spacing:.02em;text-align:center;}

  /* 主界面動作按鈕：兌換 / 交換 */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;}
  .act{
    padding:19px 6px;border:3px solid var(--ink);border-radius:18px;
    font:inherit;font-size:16px;font-weight:900;letter-spacing:.02em;
    box-shadow:0 6px 0 var(--ink);cursor:pointer;
    transition:transform .1s,box-shadow .1s,background .15s;
  }
  .act:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink);}
  .act-redeem{background:var(--red);color:#fff;}
  .act-swap{background:var(--white);color:var(--ink);}

  /* ---------- 發卡預覽 ---------- */
  .reveal{
    position:fixed;inset:0;z-index:80;display:none;place-items:center;
    background:rgba(18,12,10,.86);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    padding:24px;
  }
  .reveal.on{display:grid;}
  .reveal.out{animation:fadeOut .3s ease both;}
  @keyframes fadeOut{to{opacity:0;}}

  .reveal-inner{position:relative;width:min(80vw,330px);}

  .reveal-card{
    width:100%;display:block;border-radius:18px;border:3px solid var(--ink);
    box-shadow:0 20px 46px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06) inset;
    animation:cardIn .64s cubic-bezier(.18,1.42,.42,1) both;
    will-change:transform,opacity;
  }
  @keyframes cardIn{
    0%{transform:scale(.5) rotate(-10deg);opacity:0;}
    55%{opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }

  .glow{
    position:absolute;inset:-14%;border-radius:50%;pointer-events:none;z-index:-1;
    background:radial-gradient(circle,rgba(255,206,120,.42) 0%,rgba(255,206,120,0) 62%);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(.94);opacity:.75;}50%{transform:scale(1.06);opacity:1;}}

  .reveal-close{
    position:absolute;top:-15px;right:-15px;width:46px;height:46px;padding:0;z-index:5;
    border:3px solid var(--ink);border-radius:50%;background:var(--red);color:#fff;
    box-shadow:0 4px 0 var(--ink);cursor:pointer;display:grid;place-items:center;
    transition:transform .1s,box-shadow .1s;
    animation:closeIn .4s .5s both;
  }
  .reveal-close:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
  .reveal-close svg{width:20px;height:20px;}
  @keyframes closeIn{from{opacity:0;transform:scale(.4);}to{opacity:1;transform:scale(1);}}

  .reveal-cap{margin-top:20px;text-align:center;animation:capIn .5s .42s both;}
  @keyframes capIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .reveal-tag{
    display:inline-block;padding:5px 13px;border-radius:20px;background:var(--red);color:#fff;
    font-size:11px;font-weight:900;letter-spacing:.22em;text-indent:.22em;border:2.5px solid var(--ink);
  }
  .reveal-name{margin:11px 0 0;color:#FBFFFF;font-size:19px;font-weight:900;letter-spacing:.09em;}
  .reveal-hint{margin:8px 0 0;color:rgba(251,255,254,.52);font-size:11.5px;font-weight:700;letter-spacing:.1em;}

  /* ---------- 輕提示 ---------- */
  .toast{
    position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);z-index:90;
    transform:translate(-50%,-160%);opacity:0;pointer-events:none;
    transition:transform .34s cubic-bezier(.2,1.2,.4,1),opacity .2s;
    background:var(--ink);color:var(--white);padding:11px 18px;border-radius:14px;
    font-size:13px;font-weight:800;letter-spacing:.05em;max-width:calc(100% - 40px);text-align:center;
    box-shadow:0 8px 20px rgba(34,23,19,.2);
  }
  .toast.on{transform:translate(-50%,0);opacity:1;}
</style>
</head>
<body>

<div id="stage">

  <!-- ========== 1. 手機號登陸 ========== -->
  <section class="screen on" id="scrAuth">
    <div class="wrap">
      <div class="brand">
        <img class="brand-mascot" src="assets/mascot.webp" alt="丸俠">
        <h1>丸俠集卡</h1>
        <div class="sub">大埔振興肉丸 · 集換式印花</div>
      </div>

      <div class="panel">
        <h2 class="panel-title">會員登陸</h2>

        <div class="field">
          <label for="inPhone">手機號碼</label>
          <input id="inPhone" type="tel" inputmode="numeric" autocomplete="tel"
                 placeholder="請輸入手機號碼" maxlength="15">
        </div>

        <div class="field">
          <label for="inCode">驗證碼</label>
          <div class="code-row">
            <input id="inCode" type="tel" inputmode="numeric" autocomplete="one-time-code"
                   placeholder="6 位數字" maxlength="6">
            <button class="code-btn" id="btnSendCode" type="button">獲取驗證碼</button>
          </div>
          <div class="code-hint" id="codeHint"></div>
        </div>

        <p class="autonote">如未有大埔振興會員，系統會自動將手機號用於註冊會員</p>

        <button class="btn" id="btnSubmit" type="button">！登入並領卡！</button>
        <div class="msg" id="msg"></div>
      </div>

      <p class="fineprint">登入後系統將隨機發放一張可交換印花卡</p>
    </div>
  </section>

  <!-- ========== 2. 主活動界面（占位） ========== -->
  <section class="screen" id="scrMain">
    <div class="wrap">
      <div class="topbar">
        <div>
          <div class="t">丸俠集卡</div>
          <div class="who" id="whoAmI">—</div>
        </div>
        <button class="ghost" id="btnLogout" type="button">登出</button>
      </div>

      <div class="sec-title">
        <h2>我的卡冊</h2>
        <span id="progress">0 / 4</span>
      </div>

      <div class="album" id="album"></div>

      <div class="actions">
        <button class="act act-redeem" id="btnRedeem" type="button">兌換獎品！</button>
        <button class="act act-swap" id="btnSwap" type="button">交換卡片！</button>
      </div>
    </div>
  </section>

</div>

<!-- ========== 3. 發卡放大預覽 ========== -->
<div class="toast" id="toast"></div>
<div class="reveal" id="reveal" aria-hidden="true">
  <div class="reveal-inner">
    <div class="glow"></div>
    <img class="reveal-card" id="revealCard" src="" alt="">
    <button class="reveal-close" id="btnCloseReveal" type="button" aria-label="關閉">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
        <path d="M5 5l14 14M19 5L5 19"/>
      </svg>
    </button>
    <div class="reveal-cap">
      <div class="reveal-tag" id="revealTag">獲得卡片</div>
      <p class="reveal-name" id="revealName">—</p>
      <p class="reveal-hint">已收入卡冊 · 可與好友交換</p>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ================= 卡池（共 5 張：普通 ×2、稀有 ×2、隱藏 ×1） ================= */
  var CARDS = [
    { id:'A', name:'魚丸隊長 · 叉腰', rank:'普通', img:'assets/card_a.webp', thumb:'assets/thumb_a.webp' },
    { id:'B', name:'丸俠 · 蓄力',     rank:'普通', img:'assets/card_b.webp', thumb:'assets/thumb_b.webp' },
    { id:'C', name:'魚丸隊長 · 騰空', rank:'稀有', img:'assets/card_c.webp', thumb:'assets/thumb_c.webp' },
    { id:'D', name:'丸俠 · 展翅',     rank:'稀有', img:'assets/card_d.webp', thumb:'assets/thumb_d.webp' },
    /* ★ 隱藏款：雙角色同框。卡面圖未出，ready:false ⇒ 卡冊照樣顯示第 5 格（鎖定態）、但不進入抽卡池。
       出圖後把 card_e.webp / thumb_e.webp 放進 assets，並把 ready 改成 true 即可啟用。 */
    { id:'E', name:'雙雄同框', rank:'隱藏', ready:false,
      img:'assets/card_e.webp', thumb:'assets/thumb_e.webp' }
  ];

  /* 隱藏款是否可抽（等卡面圖就緒才開） */
  function drawable(c){ return c.ready !== false; }

  /* 發卡規則：'every-login' 每次登入發一張；'daily' 每天最多一張 */
  var DRAW_RULE = 'every-login';
  /* 抽卡權重：未擁有的卡 ×3，已擁有的 ×1（設為 1/1 即完全等概率） */
  var W_NEW = 3, W_OWNED = 1;

  /* 驗證碼有效期（毫秒）與重發間隔（秒） */
  var CODE_TTL = 5 * 60 * 1000;
  var RESEND_GAP = 60;

  /* ================= 本地存儲 ================= */
  var K_USERS = 'wanxia.users.v2';
  var K_CUR   = 'wanxia.current.v2';

  function readUsers(){
    try { return JSON.parse(localStorage.getItem(K_USERS) || '{}') || {}; }
    catch(e){ return {}; }
  }
  function writeUsers(u){
    try { localStorage.setItem(K_USERS, JSON.stringify(u)); } catch(e){}
  }
  function getCur(){ try { return localStorage.getItem(K_CUR) || ''; } catch(e){ return ''; } }
  function setCur(n){
    try { n ? localStorage.setItem(K_CUR, n) : localStorage.removeItem(K_CUR); } catch(e){}
  }

  /* ================= DOM ================= */
  var $ = function(id){ return document.getElementById(id); };
  var scrAuth=$('scrAuth'), scrMain=$('scrMain');
  var inPhone=$('inPhone'), inCode=$('inCode');
  var btnSendCode=$('btnSendCode'), codeHint=$('codeHint');
  var btnSubmit=$('btnSubmit'), msgEl=$('msg');
  var album=$('album'), whoAmI=$('whoAmI'), progressEl=$('progress');
  var reveal=$('reveal'), revealCard=$('revealCard'), revealName=$('revealName'), revealTag=$('revealTag');
  var btnCloseReveal=$('btnCloseReveal'), btnLogout=$('btnLogout');
  var toastEl=$('toast'), toastTimer=null;

  var currentUser = '';

  /* ================= 提示 ================= */
  function say(text, kind){
    msgEl.textContent = text;
    msgEl.className = 'msg on ' + (kind || 'err');
  }
  function clearMsg(){ msgEl.className = 'msg'; msgEl.textContent = ''; }

  function toast(text){
    toastEl.textContent = text;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 2600);
  }

  /* ================= 手機號處理 ================= */
  function digits(s){ return (s || '').replace(/\D/g, ''); }

  function validPhone(p){
    return p.length === 8 || p.length === 11;
  }

  function maskPhone(p){
    if (p.length === 11) return p.slice(0, 3) + ' **** ' + p.slice(-4);
    if (p.length === 8)  return p.slice(0, 4) + ' ****';
    return p;
  }

  /* ================= 驗證碼 ================= */
  var sent = { phone:'', code:'', exp:0 };
  var coolTimer = null, coolLeft = 0;

  function setSendBtn(){
    if (coolLeft > 0){
      btnSendCode.disabled = true;
      btnSendCode.textContent = '重發 ' + coolLeft + 's';
    } else {
      btnSendCode.disabled = false;
      btnSendCode.textContent = '獲取驗證碼';
    }
  }

  function startCool(){
    coolLeft = RESEND_GAP;
    setSendBtn();
    clearInterval(coolTimer);
    coolTimer = setInterval(function(){
      coolLeft--;
      if (coolLeft <= 0){
        clearInterval(coolTimer);
        coolLeft = 0;
      }
      setSendBtn();
    }, 1000);
  }

  function sendCode(){
    clearMsg();
    var p = digits(inPhone.value);
    inPhone.value = p;

    if (!p) return say('請先輸入手機號碼');
    if (!validPhone(p)) return say('手機號碼應為 8 位或 11 位數字');

    var code = String(Math.floor(100000 + Math.random() * 900000));
    sent = { phone: p, code: code, exp: Date.now() + CODE_TTL };

    codeHint.textContent = '測試通道驗證碼 ' + code + ' · 5 分鐘內有效';
    codeHint.classList.add('on');

    startCool();
    inCode.value = '';
    inCode.focus();
  }

  btnSendCode.addEventListener('click', sendCode);

  /* ================= 屏幕切換 ================= */
  function showScreen(el){
    [scrAuth, scrMain].forEach(function(s){ s.classList.toggle('on', s === el); });
    $('stage').scrollTop = 0;
  }

  /* ================= 主界面渲染 ================= */
  function renderMain(){
    var users = readUsers();
    var u = users[currentUser];
    if (!u) return;

    whoAmI.textContent = maskPhone(currentUser) + ' · 已登入';

    var count = {};
    (u.cards || []).forEach(function(id){ count[id] = (count[id] || 0) + 1; });

    var got = 0, html = '';
    CARDS.forEach(function(c){
      var n = count[c.id] || 0;
      var wide = (c.id === 'E') ? ' wide' : '';
      if (c.id === 'E'){
        if (n > 0 && drawable(c)){
          got++;
          html += '<div class="slot got wide">' +
                    '<img src="' + c.thumb + '" alt="' + c.name + '">' +
                    (n > 1 ? '<div class="num">×' + n + '</div>' : '') +
                  '</div>';
        } else {
          html += '<div class="slot locked">' +
                    '<span class="lk-tag">隱藏款</span>' +
                    '<b>？</b>' +
                  '</div>';
        }
        return;
      }
      if (n > 0) {
        got++;
        html += '<div class="slot got">' +
                  '<img src="' + c.thumb + '" alt="' + c.name + '">' +
                  (n > 1 ? '<div class="num">×' + n + '</div>' : '') +
                '</div>';
      } else {
        html += '<div class="slot empty"><b>' + c.id + '</b><i>未獲得</i></div>';
      }
    });
    album.innerHTML = html;
    progressEl.textContent = got + ' / ' + CARDS.length;
  }

  /* ================= 抽卡 ================= */
  function drawCard(owned){
    var pool = [];
    CARDS.forEach(function(c){
      if (!drawable(c)) return;                 // 隱藏款卡面未就緒，暫不入池
      var w = (owned && owned[c.id]) ? W_OWNED : W_NEW;
      for (var i=0;i<w;i++) pool.push(c);
    });
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function canDraw(u){
    if (DRAW_RULE === 'daily'){
      var last = u.lastDraw || 0;
      if (!last) return true;
      return new Date(last).toDateString() !== new Date().toDateString();
    }
    return true;
  }

  /* ================= 發卡預覽 ================= */
  var revealTimer = null;
  function showReveal(card){
    revealCard.src = card.img;
    revealCard.alt = card.name;
    revealName.textContent = card.name;
    revealTag.textContent = card.rank === '稀有' ? '稀有卡片' : '獲得卡片';

    reveal.classList.remove('out');
    reveal.classList.add('on');
    reveal.setAttribute('aria-hidden', 'false');

    revealCard.style.animation = 'none';
    void revealCard.offsetWidth;
    revealCard.style.animation = '';
  }

  function hideReveal(){
    if (!reveal.classList.contains('on')) return;
    reveal.classList.add('out');
    reveal.setAttribute('aria-hidden', 'true');
    clearTimeout(revealTimer);
    revealTimer = setTimeout(function(){
      reveal.classList.remove('on', 'out');
    }, 300);
  }

  btnCloseReveal.addEventListener('click', hideReveal);

  /* ================= 進入主界面（並發放卡片） ================= */
  function enterMain(withDraw){
    showScreen(scrMain);
    renderMain();
    if (!withDraw) return;

    var users = readUsers();
    var u = users[currentUser];
    if (!u) return;

    if (!canDraw(u)){
      toast('今天已經領過卡片了，明天再來');
      return;
    }

    var owned = {};
    (u.cards || []).forEach(function(id){ owned[id] = 1; });

    var card = drawCard(owned);
    u.cards.push(card.id);
    u.lastDraw = Date.now();
    writeUsers(users);
    renderMain();
    setTimeout(function(){ showReveal(card); }, 300);
  }

  /* ================= 登入（手機號 + 驗證碼，不存在則自動註冊） ================= */
  var busy = false;
  function submit(){
    if (busy) return;
    clearMsg();

    var p = digits(inPhone.value);
    inPhone.value = p;
    var code = digits(inCode.value);

    if (!p) return say('請先輸入手機號碼');
    if (!validPhone(p)) return say('手機號碼應為 8 位或 11 位數字');
    if (!code) return say('請輸入驗證碼');
    if (code.length !== 6) return say('驗證碼應為 6 位數字');

    if (!sent.code) return say('請先點擊「獲取驗證碼」');
    if (sent.phone !== p) return say('驗證碼與手機號碼不符，請重新獲取');
    if (Date.now() > sent.exp) return say('驗證碼已過期，請重新獲取');
    if (sent.code !== code) return say('驗證碼錯誤');

    var users = readUsers();
    var isNew = !users[p];

    busy = true;
    btnSubmit.disabled = true;

    if (isNew){
      users[p] = { phone: p, cards: [], at: Date.now() };
      writeUsers(users);
      say('已自動為你註冊會員，正在發卡…', 'ok');
    } else {
      say('登入成功，正在為你發卡…', 'ok');
    }

    currentUser = p;
    setCur(p);
    sent = { phone:'', code:'', exp:0 };
    codeHint.classList.remove('on');
    codeHint.textContent = '';
    inCode.value = '';
    clearInterval(coolTimer); coolLeft = 0; setSendBtn();   // 登入成功：重置重發倒數

    setTimeout(function(){
      enterMain(true);
      busy = false;
      btnSubmit.disabled = false;
    }, 320);
  }

  btnSubmit.addEventListener('click', submit);
  [inPhone, inCode].forEach(function(el){
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter') submit();
    });
    el.addEventListener('input', function(){
      var v = digits(el.value);
      if (v !== el.value) el.value = v;
    });
  });

  /* ================= 主界面動作（尚未實作，先給回饋） ================= */
  $('btnRedeem').addEventListener('click', function(){ toast('兌換功能即將開放'); });
  $('btnSwap').addEventListener('click', function(){ toast('交換功能即將開放'); });

  /* ================= 登出 ================= */
  btnLogout.addEventListener('click', function(){
    setCur('');
    currentUser = '';
    inPhone.value = '';
    inCode.value = '';
    sent = { phone:'', code:'', exp:0 };
    codeHint.classList.remove('on');
    codeHint.textContent = '';
    clearInterval(coolTimer); coolLeft = 0; setSendBtn();
    clearMsg();
    showScreen(scrAuth);
  });

  /* ================= 啟動 ================= */
  (function boot(){
    var cur = getCur();
    var users = readUsers();
    if (cur && users[cur]){
      currentUser = cur;
      enterMain(false);          // 已登入：恢復會話，不重複發卡
    } else {
      setCur('');
      showScreen(scrAuth);
    }
  })();

})();
</script>
</body>
</html>
