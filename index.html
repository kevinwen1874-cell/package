<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FAF5EB">
<title>丸俠集卡 · 大埔振興肉丸</title>
<style>
  :root{
    --red:#E32412;
    --red-dk:#B81709;
    --gold:#A87E40;
    --ink:#221713;
    --paper:#FAF5EB;
    --white:#FBFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--paper);
    background-image:radial-gradient(rgba(34,23,19,.055) 1px, transparent 1px);
    background-size:14px 14px;
    color:var(--ink);
    font-family:"PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    overflow:hidden;
  }
  #stage{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}

  .screen{display:none;min-height:100%;padding:calc(env(safe-area-inset-top) + 26px) 20px calc(env(safe-area-inset-bottom) + 24px);}
  .screen.on{display:flex;flex-direction:column;}
  .wrap{width:100%;max-width:430px;margin:auto;}

  /* ---------- 品牌頭 ---------- */
  .brand{text-align:center;margin-bottom:20px;}
  .brand-mascot{width:172px;max-width:52vw;display:block;margin:0 auto 6px;filter:drop-shadow(0 8px 10px rgba(34,23,19,.16));}
  .brand h1{
    margin:0;font-size:clamp(30px,9vw,38px);font-weight:900;letter-spacing:.2em;
    text-indent:.2em;line-height:1.1;
  }
  .brand .sub{
    margin-top:9px;font-size:11.5px;font-weight:800;letter-spacing:.28em;color:var(--gold);
    text-indent:.28em;
  }

  /* ---------- 表單面板 ---------- */
  .panel{
    background:var(--white);border:3px solid var(--ink);border-radius:22px;
    box-shadow:0 7px 0 var(--ink);padding:20px 18px 18px;
  }
  .panel-title{
    margin:0 0 16px;font-size:17px;font-weight:900;letter-spacing:.22em;text-indent:.22em;
    text-align:center;color:var(--ink);
  }
  .panel-title::after{
    content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--red);
    margin:9px auto 0;
  }

  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;font-weight:900;letter-spacing:.14em;color:#7d706a;margin:0 0 6px 3px;}
  .field input{
    width:100%;padding:13px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;
    font:inherit;font-size:16px;font-weight:800;color:var(--ink);outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  .field input::placeholder{color:#c0b4ae;font-weight:700;}
  .field input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(227,36,18,.11);}

  .code-row{display:flex;gap:9px;align-items:stretch;}
  .code-row input{flex:1 1 auto;min-width:0;letter-spacing:.18em;}
  .code-btn{
    flex:0 0 auto;padding:0 15px;border:3px solid var(--ink);border-radius:14px;background:var(--white);
    font:inherit;font-size:13px;font-weight:900;letter-spacing:.06em;color:var(--red);cursor:pointer;
    white-space:nowrap;transition:transform .1s,background .15s,color .15s;
  }
  .code-btn:active{transform:translateY(2px);}
  .code-btn[disabled]{background:#EFE7DC;color:#a79b94;border-color:rgba(34,23,19,.35);cursor:default;}
  .code-hint{
    margin:7px 1px 0;font-size:11px;font-weight:800;line-height:1.5;letter-spacing:.02em;
    color:var(--gold);display:none;
  }
  .code-hint.on{display:block;}

  .autonote{
    margin:4px 2px 13px;font-size:11px;font-weight:800;line-height:1.65;letter-spacing:.02em;
    color:#9a8d86;text-align:center;
  }

  .btn{
    width:100%;padding:15px;margin-top:0;border:3px solid var(--ink);border-radius:16px;
    background:var(--red);color:#fff;font:inherit;font-size:17px;font-weight:900;letter-spacing:.14em;
    box-shadow:0 6px 0 var(--ink);cursor:pointer;
    transition:transform .1s,box-shadow .1s,background .15s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink);}
  .btn[disabled]{background:#c9bdb7;box-shadow:0 4px 0 var(--ink);cursor:default;}

  .msg{
    margin:12px 2px 0;font-size:13px;font-weight:800;line-height:1.5;border-radius:10px;
    padding:9px 11px;display:none;
  }
  .msg.on{display:block;}
  .msg.err{background:#FDE8E5;color:#B81709;border:2px solid #F3BDB6;}
  .msg.ok{background:#E8F6EC;color:#1D7B3E;border:2px solid #B8E0C4;}

  .fineprint{margin:18px 0 0;text-align:center;font-size:11px;line-height:1.7;color:#9a8d86;font-weight:700;letter-spacing:.03em;}

  /* ---------- 主界面 ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .topbar .t{font-size:17px;font-weight:900;letter-spacing:.15em;}
  .who{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.06em;margin-top:3px;}
  .ghost{
    padding:9px 14px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;
    font:inherit;font-size:12.5px;font-weight:900;letter-spacing:.1em;color:var(--ink);cursor:pointer;
  }
  .ghost:active{transform:translateY(2px);}

  .sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:0 3px 11px;}
  .sec-title h2{margin:0;font-size:15px;font-weight:900;letter-spacing:.16em;}
  .sec-title span{font-size:12px;font-weight:900;color:var(--red);letter-spacing:.05em;}

  .album{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .slot{position:relative;aspect-ratio:900/1040;border-radius:15px;overflow:hidden;background:#fff;}
  .slot.got{border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);}
  .slot.got img{width:100%;height:100%;object-fit:cover;display:block;}
  .slot.empty{
    border:3px dashed rgba(34,23,19,.26);background:rgba(255,255,255,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  }
  .slot.empty b{font-size:38px;font-weight:900;color:rgba(34,23,19,.155);line-height:1;letter-spacing:.02em;}
  .slot.empty i{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.16em;color:rgba(34,23,19,.28);}

  /* 隱藏款卡位：獨佔一行，深底斜紋 + 描金標籤 */
  .slot.locked{
    grid-column:1 / -1;aspect-ratio:900/380;border:3px solid var(--ink);border-radius:15px;
    box-shadow:0 5px 0 var(--ink);overflow:hidden;position:relative;
    background:repeating-linear-gradient(45deg,#2A1E19 0 9px,#332520 9px 18px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  }
  .slot.locked b{font-size:58px;font-weight:900;line-height:1;color:rgba(255,206,120,.34);letter-spacing:.04em;}
  .lk-tag{
    position:absolute;top:9px;left:9px;padding:3px 10px;border-radius:10px;background:var(--gold);
    color:#fff;font-size:10px;font-weight:900;letter-spacing:.16em;text-indent:.16em;border:2px solid var(--ink);
  }
  .slot.got.wide{grid-column:1 / -1;aspect-ratio:900/380;}
  .slot.got.wide img{object-fit:cover;}
  .slot .num{
    position:absolute;top:7px;right:7px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;
    background:var(--red);border:2.5px solid var(--ink);color:#fff;font-size:12px;font-weight:900;
    display:grid;place-items:center;
  }
  .cardname{margin:7px 2px 0;font-size:11.5px;font-weight:800;color:#7d706a;letter-spacing:.02em;text-align:center;}

  /* 主界面動作按鈕：兌換 / 交換 */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;}
  .act{
    padding:19px 6px;border:3px solid var(--ink);border-radius:18px;
    font:inherit;font-size:16px;font-weight:900;letter-spacing:.02em;
    box-shadow:0 6px 0 var(--ink);cursor:pointer;
    transition:transform .1s,box-shadow .1s,background .15s;
  }
  .act:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink);}
  .act-redeem{background:var(--red);color:#fff;}
  .act-swap{background:var(--white);color:var(--ink);}

  /* ---------- 發卡預覽 ---------- */
  .reveal{
    position:fixed;inset:0;z-index:80;display:none;place-items:center;
    background:rgba(18,12,10,.86);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    padding:24px;
  }
  .reveal.on{display:grid;}
  .reveal.out{animation:fadeOut .3s ease both;}
  @keyframes fadeOut{to{opacity:0;}}

  .reveal-inner{position:relative;width:min(80vw,330px);}

  .reveal-card{
    width:100%;display:block;border-radius:18px;border:3px solid var(--ink);
    box-shadow:0 20px 46px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06) inset;
    animation:cardIn .64s cubic-bezier(.18,1.42,.42,1) both;
    will-change:transform,opacity;
  }
  @keyframes cardIn{
    0%{transform:scale(.5) rotate(-10deg);opacity:0;}
    55%{opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }

  .glow{
    position:absolute;inset:-14%;border-radius:50%;pointer-events:none;z-index:-1;
    background:radial-gradient(circle,rgba(255,206,120,.42) 0%,rgba(255,206,120,0) 62%);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(.94);opacity:.75;}50%{transform:scale(1.06);opacity:1;}}

  .reveal-close{
    position:absolute;top:-15px;right:-15px;width:46px;height:46px;padding:0;z-index:5;
    border:3px solid var(--ink);border-radius:50%;background:var(--red);color:#fff;
    box-shadow:0 4px 0 var(--ink);cursor:pointer;display:grid;place-items:center;
    transition:transform .1s,box-shadow .1s;
    animation:closeIn .4s .5s both;
  }
  .reveal-close:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
  .reveal-close svg{width:20px;height:20px;}
  @keyframes closeIn{from{opacity:0;transform:scale(.4);}to{opacity:1;transform:scale(1);}}

  .reveal-cap{margin-top:20px;text-align:center;animation:capIn .5s .42s both;}
  @keyframes capIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .reveal-tag{
    display:inline-block;padding:5px 13px;border-radius:20px;background:var(--red);color:#fff;
    font-size:11px;font-weight:900;letter-spacing:.22em;text-indent:.22em;border:2.5px solid var(--ink);
  }
  .reveal-name{margin:11px 0 0;color:#FBFFFF;font-size:19px;font-weight:900;letter-spacing:.09em;}
  .reveal-hint{margin:8px 0 0;color:rgba(251,255,254,.52);font-size:11.5px;font-weight:700;letter-spacing:.1em;}

  /* ---------- 兌換獎品頁 ---------- */
  #scrRedeem .wrap{margin:0 auto;}
  .subbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .subbar .t{flex:1;font-size:17px;font-weight:900;letter-spacing:.15em;}
  .backbtn{
    flex:0 0 auto;width:40px;height:40px;padding:0;border:3px solid var(--ink);border-radius:12px;
    background:var(--white);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;
    transition:transform .1s,box-shadow .1s;
  }
  .backbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
  .backbtn svg{width:18px;height:18px;}

  .wallet{
    display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;
    border:3px solid var(--ink);border-radius:18px;background:var(--white);
    box-shadow:0 5px 0 var(--ink);margin-bottom:15px;
  }
  .wallet .num{font-size:12.5px;font-weight:900;letter-spacing:.04em;white-space:nowrap;}
  .wallet .num b{font-size:30px;margin-right:4px;font-variant-numeric:tabular-nums;}
  .wallet .sub{font-size:10.5px;font-weight:800;color:#9a8d86;line-height:1.6;text-align:right;}

  .prize{
    display:flex;align-items:center;gap:12px;padding:12px;border:3px solid var(--ink);border-radius:16px;
    background:var(--white);box-shadow:0 4px 0 var(--ink);margin-bottom:10px;
  }
  .prize.off{box-shadow:0 4px 0 rgba(34,23,19,.28);}
  .prize.off .pico,.prize.off .pname,.prize.off .pmeta{opacity:.55;}
  .pico{
    flex:0 0 52px;width:52px;height:52px;border:2.5px solid var(--ink);border-radius:14px;
    background:var(--paper);display:grid;place-items:center;
  }
  .pico svg{width:25px;height:25px;}
  .pbody{flex:1 1 auto;min-width:0;}
  .pname{font-size:14.5px;font-weight:900;letter-spacing:.02em;line-height:1.3;}
  .pmeta{margin-top:4px;font-size:11px;font-weight:800;color:#8c7f78;letter-spacing:.01em;line-height:1.5;}
  .pbtn{
    flex:0 0 auto;padding:9px 13px;border:2.5px solid var(--ink);border-radius:12px;background:var(--red);
    color:#fff;font:inherit;font-size:12.5px;font-weight:900;letter-spacing:.06em;
    box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .1s,box-shadow .1s;
  }
  .pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}
  .pbtn.off{
    background:#EFE7DC;color:#a79b94;border-color:rgba(34,23,19,.42);box-shadow:none;cursor:default;
  }
  .pbtn.off:active{transform:none;box-shadow:none;}

  .ruleline{margin:15px 4px 0;font-size:11px;font-weight:800;color:#9a8d86;line-height:1.8;letter-spacing:.02em;text-align:center;}

  /* ---------- 底部彈層 ---------- */
  .sheet{
    position:fixed;inset:0;z-index:85;display:none;align-items:flex-end;justify-content:center;
    background:rgba(18,12,10,.58);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  .sheet.on{display:flex;}
  .sheet-box{
    width:100%;max-width:460px;background:var(--paper);border:3px solid var(--ink);border-bottom:0;
    border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);
    box-shadow:0 -8px 30px rgba(0,0,0,.28);animation:sheetIn .28s cubic-bezier(.2,1.1,.4,1) both;
  }
  @keyframes sheetIn{from{transform:translateY(30px);opacity:.55;}to{transform:none;opacity:1;}}
  .sheet h3{margin:0 0 5px;font-size:16.5px;font-weight:900;letter-spacing:.1em;}
  .sheet .ssub{font-size:11.5px;font-weight:800;color:#8c7f78;line-height:1.65;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0 0;}
  .chip{
    padding:5px 10px;border:2px solid var(--ink);border-radius:9px;background:var(--white);
    font-size:11.5px;font-weight:900;letter-spacing:.02em;
  }
  .chip.dim{background:#EFE7DC;border-color:rgba(34,23,19,.42);color:#8a7d76;}
  .warn{
    margin:11px 0 0;padding:9px 11px;border-radius:11px;background:#FDF0E4;border:2px solid #EFD3AE;
    color:#8A5A16;font-size:11.5px;font-weight:800;line-height:1.65;
  }
  .sheet .btn{margin-top:16px;}
  .codebox{
    margin:14px 0 0;padding:15px;border:3px dashed var(--ink);border-radius:16px;background:var(--white);text-align:center;
  }
  .codebox .k{font-size:10.5px;font-weight:900;letter-spacing:.22em;color:#9a8d86;}
  .codebox .v{margin-top:7px;font-size:25px;font-weight:900;letter-spacing:.12em;font-variant-numeric:tabular-nums;}

  .reclist{max-height:52vh;overflow-y:auto;margin-top:12px;}
  .rec{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:2px dashed rgba(34,23,19,.16);}
  .rec:last-child{border-bottom:0;}
  .rec .rn{font-size:13px;font-weight:900;}
  .rec .rm{margin-top:3px;font-size:10.5px;font-weight:800;color:#9a8d86;letter-spacing:.02em;}
  .rec .rc{
    font-size:11px;font-weight:900;color:var(--red);letter-spacing:.06em;text-align:right;white-space:nowrap;
  }
  .emptyrec{padding:26px 0;text-align:center;font-size:12px;font-weight:800;color:#a79b94;letter-spacing:.06em;}


  .toast{
    position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);z-index:90;
    transform:translate(-50%,-160%);opacity:0;pointer-events:none;
    transition:transform .34s cubic-bezier(.2,1.2,.4,1),opacity .2s;
    background:var(--ink);color:var(--white);padding:11px 18px;border-radius:14px;
    font-size:13px;font-weight:800;letter-spacing:.05em;max-width:calc(100% - 40px);text-align:center;
    box-shadow:0 8px 20px rgba(34,23,19,.2);
  }
  .toast.on{transform:translate(-50%,0);opacity:1;}
</style>
</head>
<body>

<div id="stage">

  <!-- ========== 1. 手機號登陸 ========== -->
  <section class="screen on" id="scrAuth">
    <div class="wrap">
      <div class="brand">
        <img class="brand-mascot" src="assets/mascot.webp" alt="丸俠">
        <h1>丸俠集卡</h1>
        <div class="sub">大埔振興肉丸 · 集換式印花</div>
      </div>

      <div class="panel">
        <h2 class="panel-title">會員登陸</h2>

        <div class="field">
          <label for="inPhone">手機號碼</label>
          <input id="inPhone" type="tel" inputmode="numeric" autocomplete="tel"
                 placeholder="請輸入手機號碼" maxlength="15">
        </div>

        <div class="field">
          <label for="inCode">驗證碼</label>
          <div class="code-row">
            <input id="inCode" type="tel" inputmode="numeric" autocomplete="one-time-code"
                   placeholder="6 位數字" maxlength="6">
            <button class="code-btn" id="btnSendCode" type="button">獲取驗證碼</button>
          </div>
          <div class="code-hint" id="codeHint"></div>
        </div>

        <p class="autonote">如未有大埔振興會員，系統會自動將手機號用於註冊會員</p>

        <button class="btn" id="btnSubmit" type="button">！登入並領卡！</button>
        <div class="msg" id="msg"></div>
      </div>

      <p class="fineprint">登入後系統將隨機發放一張可交換印花卡</p>
    </div>
  </section>

  <!-- ========== 2. 主活動界面（占位） ========== -->
  <section class="screen" id="scrMain">
    <div class="wrap">
      <div class="topbar">
        <div>
          <div class="t">丸俠集卡</div>
          <div class="who" id="whoAmI">—</div>
        </div>
        <button class="ghost" id="btnLogout" type="button">登出</button>
      </div>

      <div class="sec-title">
        <h2>我的卡冊</h2>
        <span id="progress">0 / 4</span>
      </div>

      <div class="album" id="album"></div>

      <div class="actions">
        <button class="act act-redeem" id="btnRedeem" type="button">兌換獎品！</button>
        <button class="act act-swap" id="btnSwap" type="button">交換卡片！</button>
      </div>
    </div>
  </section>

  <!-- ========== 3. 兌換獎品 ========== -->
  <section class="screen" id="scrRedeem">
    <div class="wrap">
      <div class="subbar">
        <button class="backbtn" id="btnBackRedeem" type="button" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"
               stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="t">兌換獎品</div>
        <button class="ghost" id="btnRecords" type="button">兌換記錄</button>
      </div>

      <div class="wallet">
        <div class="num"><b id="wmTotal">0</b>張印花</div>
        <div class="sub" id="wmSub">重複卡可兌換<br>扣卡時優先扣重複</div>
      </div>

      <div id="prizeList"></div>

      <p class="ruleline">
        兌換後印花即被扣除，兌換碼 30 天內有效<br>
        到店出示兌換碼即可領取，每人每款限兌一次
      </p>
    </div>
  </section>

</div>

<!-- ========== 3. 發卡放大預覽 ========== -->
<div class="toast" id="toast"></div>
<div class="reveal" id="reveal" aria-hidden="true">
  <div class="reveal-inner">
    <div class="glow"></div>
    <img class="reveal-card" id="revealCard" src="" alt="">
    <button class="reveal-close" id="btnCloseReveal" type="button" aria-label="關閉">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
        <path d="M5 5l14 14M19 5L5 19"/>
      </svg>
    </button>
    <div class="reveal-cap">
      <div class="reveal-tag" id="revealTag">獲得卡片</div>
      <p class="reveal-name" id="revealName">—</p>
      <p class="reveal-hint">已收入卡冊 · 可與好友交換</p>
    </div>
  </div>
</div>

<!-- ========== 4. 兌換彈層 ========== -->
<div class="sheet" id="sheetConfirm">
  <div class="sheet-box">
    <h3>確認兌換</h3>
    <p class="ssub" id="cfSub">—</p>
    <div class="chips" id="cfChips"></div>
    <div class="warn" id="cfWarn" style="display:none"></div>
    <button class="btn" id="btnConfirmRedeem" type="button">確認兌換</button>
    <button class="btn" id="btnCancelRedeem" type="button"
            style="background:#fff;color:#221713;margin-top:9px">再想想</button>
  </div>
</div>

<div class="sheet" id="sheetDone">
  <div class="sheet-box">
    <h3>兌換成功</h3>
    <p class="ssub" id="dnSub">—</p>
    <div class="codebox">
      <div class="k">兌換碼</div>
      <div class="v" id="dnCode">—</div>
    </div>
    <p class="ssub" id="dnExp" style="margin-top:11px;text-align:center"></p>
    <button class="btn" id="btnDoneClose" type="button">完成</button>
  </div>
</div>

<div class="sheet" id="sheetRecords">
  <div class="sheet-box">
    <h3>兌換記錄</h3>
    <div class="reclist" id="recList"></div>
    <button class="btn" id="btnRecClose" type="button">關閉</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ================= 卡池（共 5 張：普通 ×2、稀有 ×2、隱藏 ×1） ================= */
  var CARDS = [
    { id:'A', name:'魚丸隊長 · 叉腰', rank:'普通', img:'assets/card_a.webp', thumb:'assets/thumb_a.webp' },
    { id:'B', name:'丸俠 · 蓄力',     rank:'普通', img:'assets/card_b.webp', thumb:'assets/thumb_b.webp' },
    { id:'C', name:'魚丸隊長 · 騰空', rank:'稀有', img:'assets/card_c.webp', thumb:'assets/thumb_c.webp' },
    { id:'D', name:'丸俠 · 展翅',     rank:'稀有', img:'assets/card_d.webp', thumb:'assets/thumb_d.webp' },
    /* ★ 隱藏款：雙角色同框。卡面圖未出，ready:false ⇒ 卡冊照樣顯示第 5 格（鎖定態）、但不進入抽卡池。
       出圖後把 card_e.webp / thumb_e.webp 放進 assets，並把 ready 改成 true 即可啟用。 */
    { id:'E', name:'雙雄同框', rank:'隱藏', ready:false,
      img:'assets/card_e.webp', thumb:'assets/thumb_e.webp' }
  ];

  /* 隱藏款是否可抽（等卡面圖就緒才開） */
  function drawable(c){ return c.ready !== false; }

  /* 發卡規則：'every-login' 每次登入發一張；'daily' 每天最多一張 */
  var DRAW_RULE = 'every-login';
  /* 抽卡權重：未擁有的卡 ×3，已擁有的 ×1（設為 1/1 即完全等概率） */
  var W_NEW = 3, W_OWNED = 1;

  /* 驗證碼有效期（毫秒）與重發間隔（秒） */
  var CODE_TTL = 5 * 60 * 1000;
  var RESEND_GAP = 60;

  /* ================= 本地存儲 ================= */
  var K_USERS = 'wanxia.users.v2';
  var K_CUR   = 'wanxia.current.v2';

  function readUsers(){
    try { return JSON.parse(localStorage.getItem(K_USERS) || '{}') || {}; }
    catch(e){ return {}; }
  }
  function writeUsers(u){
    try { localStorage.setItem(K_USERS, JSON.stringify(u)); } catch(e){}
  }
  function getCur(){ try { return localStorage.getItem(K_CUR) || ''; } catch(e){ return ''; } }
  function setCur(n){
    try { n ? localStorage.setItem(K_CUR, n) : localStorage.removeItem(K_CUR); } catch(e){}
  }

  /* ================= DOM ================= */
  var $ = function(id){ return document.getElementById(id); };
  var scrAuth=$('scrAuth'), scrMain=$('scrMain'), scrRedeem=$('scrRedeem');
  var inPhone=$('inPhone'), inCode=$('inCode');
  var btnSendCode=$('btnSendCode'), codeHint=$('codeHint');
  var btnSubmit=$('btnSubmit'), msgEl=$('msg');
  var album=$('album'), whoAmI=$('whoAmI'), progressEl=$('progress');
  var reveal=$('reveal'), revealCard=$('revealCard'), revealName=$('revealName'), revealTag=$('revealTag');
  var btnCloseReveal=$('btnCloseReveal'), btnLogout=$('btnLogout');
  var prizeList=$('prizeList'), wmTotal=$('wmTotal'), wmSub=$('wmSub');
  var sheetConfirm=$('sheetConfirm'), sheetDone=$('sheetDone'), sheetRecords=$('sheetRecords');
  var cfSub=$('cfSub'), cfChips=$('cfChips'), cfWarn=$('cfWarn');
  var dnSub=$('dnSub'), dnCode=$('dnCode'), dnExp=$('dnExp'), recList=$('recList');
  var toastEl=$('toast'), toastTimer=null;

  var currentUser = '';

  /* ================= 提示 ================= */
  function say(text, kind){
    msgEl.textContent = text;
    msgEl.className = 'msg on ' + (kind || 'err');
  }
  function clearMsg(){ msgEl.className = 'msg'; msgEl.textContent = ''; }

  function toast(text){
    toastEl.textContent = text;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 2600);
  }

  /* ================= 手機號處理 ================= */
  function digits(s){ return (s || '').replace(/\D/g, ''); }

  function validPhone(p){
    return p.length === 8 || p.length === 11;
  }

  function maskPhone(p){
    if (p.length === 11) return p.slice(0, 3) + ' **** ' + p.slice(-4);
    if (p.length === 8)  return p.slice(0, 4) + ' ****';
    return p;
  }

  /* ================= 驗證碼 ================= */
  var sent = { phone:'', code:'', exp:0 };
  var coolTimer = null, coolLeft = 0;

  function setSendBtn(){
    if (coolLeft > 0){
      btnSendCode.disabled = true;
      btnSendCode.textContent = '重發 ' + coolLeft + 's';
    } else {
      btnSendCode.disabled = false;
      btnSendCode.textContent = '獲取驗證碼';
    }
  }

  function startCool(){
    coolLeft = RESEND_GAP;
    setSendBtn();
    clearInterval(coolTimer);
    coolTimer = setInterval(function(){
      coolLeft--;
      if (coolLeft <= 0){
        clearInterval(coolTimer);
        coolLeft = 0;
      }
      setSendBtn();
    }, 1000);
  }

  function sendCode(){
    clearMsg();
    var p = digits(inPhone.value);
    inPhone.value = p;

    if (!p) return say('請先輸入手機號碼');
    if (!validPhone(p)) return say('手機號碼應為 8 位或 11 位數字');

    var code = String(Math.floor(100000 + Math.random() * 900000));
    sent = { phone: p, code: code, exp: Date.now() + CODE_TTL };

    codeHint.textContent = '測試通道驗證碼 ' + code + ' · 5 分鐘內有效';
    codeHint.classList.add('on');

    startCool();
    inCode.value = '';
    inCode.focus();
  }

  btnSendCode.addEventListener('click', sendCode);

  /* ================= 屏幕切換 ================= */
  function showScreen(el){
    [scrAuth, scrMain, scrRedeem].forEach(function(s){ s.classList.toggle('on', s === el); });
    $('stage').scrollTop = 0;
  }

  /* ================= 主界面渲染 ================= */
  function renderMain(){
    var users = readUsers();
    var u = users[currentUser];
    if (!u) return;

    whoAmI.textContent = maskPhone(currentUser) + ' · 已登入';

    var count = {};
    (u.cards || []).forEach(function(id){ count[id] = (count[id] || 0) + 1; });

    var got = 0, html = '';
    CARDS.forEach(function(c){
      var n = count[c.id] || 0;
      var wide = (c.id === 'E') ? ' wide' : '';
      if (c.id === 'E'){
        if (n > 0 && drawable(c)){
          got++;
          html += '<div class="slot got wide">' +
                    '<img src="' + c.thumb + '" alt="' + c.name + '">' +
                    (n > 1 ? '<div class="num">×' + n + '</div>' : '') +
                  '</div>';
        } else {
          html += '<div class="slot locked">' +
                    '<span class="lk-tag">隱藏款</span>' +
                    '<b>？</b>' +
                  '</div>';
        }
        return;
      }
      if (n > 0) {
        got++;
        html += '<div class="slot got">' +
                  '<img src="' + c.thumb + '" alt="' + c.name + '">' +
                  (n > 1 ? '<div class="num">×' + n + '</div>' : '') +
                '</div>';
      } else {
        html += '<div class="slot empty"><b>' + c.id + '</b><i>未獲得</i></div>';
      }
    });
    album.innerHTML = html;
    progressEl.textContent = got + ' / ' + CARDS.length;
  }

  /* ================= 抽卡 ================= */
  function drawCard(owned){
    var pool = [];
    CARDS.forEach(function(c){
      if (!drawable(c)) return;                 // 隱藏款卡面未就緒，暫不入池
      var w = (owned && owned[c.id]) ? W_OWNED : W_NEW;
      for (var i=0;i<w;i++) pool.push(c);
    });
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function canDraw(u){
    if (DRAW_RULE === 'daily'){
      var last = u.lastDraw || 0;
      if (!last) return true;
      return new Date(last).toDateString() !== new Date().toDateString();
    }
    return true;
  }

  /* ================= 發卡預覽 ================= */
  var revealTimer = null;
  function showReveal(card){
    revealCard.src = card.img;
    revealCard.alt = card.name;
    revealName.textContent = card.name;
    revealTag.textContent = card.rank === '稀有' ? '稀有卡片' : '獲得卡片';

    reveal.classList.remove('out');
    reveal.classList.add('on');
    reveal.setAttribute('aria-hidden', 'false');

    revealCard.style.animation = 'none';
    void revealCard.offsetWidth;
    revealCard.style.animation = '';
  }

  function hideReveal(){
    if (!reveal.classList.contains('on')) return;
    reveal.classList.add('out');
    reveal.setAttribute('aria-hidden', 'true');
    clearTimeout(revealTimer);
    revealTimer = setTimeout(function(){
      reveal.classList.remove('on', 'out');
    }, 300);
  }

  btnCloseReveal.addEventListener('click', hideReveal);

  /* ================= 進入主界面（並發放卡片） ================= */
  function enterMain(withDraw){
    showScreen(scrMain);
    renderMain();
    if (!withDraw) return;

    var users = readUsers();
    var u = users[currentUser];
    if (!u) return;

    if (!canDraw(u)){
      toast('今天已經領過卡片了，明天再來');
      return;
    }

    var owned = {};
    (u.cards || []).forEach(function(id){ owned[id] = 1; });

    var card = drawCard(owned);
    u.cards.push(card.id);
    u.lastDraw = Date.now();
    writeUsers(users);
    renderMain();
    setTimeout(function(){ showReveal(card); }, 300);
  }

  /* ================= 登入（手機號 + 驗證碼，不存在則自動註冊） ================= */
  var busy = false;
  function submit(){
    if (busy) return;
    clearMsg();

    var p = digits(inPhone.value);
    inPhone.value = p;
    var code = digits(inCode.value);

    if (!p) return say('請先輸入手機號碼');
    if (!validPhone(p)) return say('手機號碼應為 8 位或 11 位數字');
    if (!code) return say('請輸入驗證碼');
    if (code.length !== 6) return say('驗證碼應為 6 位數字');

    if (!sent.code) return say('請先點擊「獲取驗證碼」');
    if (sent.phone !== p) return say('驗證碼與手機號碼不符，請重新獲取');
    if (Date.now() > sent.exp) return say('驗證碼已過期，請重新獲取');
    if (sent.code !== code) return say('驗證碼錯誤');

    var users = readUsers();
    var isNew = !users[p];

    busy = true;
    btnSubmit.disabled = true;

    if (isNew){
      users[p] = { phone: p, cards: [], at: Date.now() };
      writeUsers(users);
      say('已自動為你註冊會員，正在發卡…', 'ok');
    } else {
      say('登入成功，正在為你發卡…', 'ok');
    }

    currentUser = p;
    setCur(p);
    sent = { phone:'', code:'', exp:0 };
    codeHint.classList.remove('on');
    codeHint.textContent = '';
    inCode.value = '';
    clearInterval(coolTimer); coolLeft = 0; setSendBtn();   // 登入成功：重置重發倒數

    setTimeout(function(){
      enterMain(true);
      busy = false;
      btnSubmit.disabled = false;
    }, 320);
  }

  btnSubmit.addEventListener('click', submit);
  [inPhone, inCode].forEach(function(el){
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter') submit();
    });
    el.addEventListener('input', function(){
      var v = digits(el.value);
      if (v !== el.value) el.value = v;
    });
  });

  /* ================= 兌換獎品 ================= */
  /* 獎品設定（改這裡就能調獎品、門檻與限兌次數）
     cost = 需要的印花張數（會扣卡，優先扣重複卡）
     need = 額外門檻：'' 無／'all' 集齊全部款式（含隱藏款）／'full' 集齊 A–D／'hidden' 持有隱藏款
     per  = 每人限兌次數（0 = 不限次數）
     獎品一律不限庫存（不設「限量 N 份」） */
  var PRIZES = [
    { id:'p2', name:'大埔振興 $50 現金券', cost:4, need:'',    per:1, note:'全線門市通用，不設找續',                icon:'ticket' },
    { id:'p4', name:'限定丸俠公仔',        cost:0, need:'all', per:1, note:'需集齊全部 5 款，含隱藏款', icon:'doll'   }
  ];

  var ICON = {
    doll:'<svg viewBox="0 0 24 24" fill="none" stroke="#221713" stroke-width="2.1" stroke-linejoin="round">' +
         '<circle cx="12" cy="9.4" r="6.4"/>' +
         '<path d="M5.5 11.4c-1.9.6-2.9 2-3.2 3.5" stroke-linecap="round"/>' +
         '<path d="M18.5 11.4c1.9.6 2.9 2 3.2 3.5" stroke-linecap="round"/>' +
         '<path d="M9.1 15.1c-.7 1.4-1.1 2.9-1.1 4.2" stroke-linecap="round"/>' +
         '<path d="M14.9 15.1c.7 1.4 1.1 2.9 1.1 4.2" stroke-linecap="round"/>' +
         '<circle cx="9.9" cy="8.6" r=".9" fill="#221713" stroke="none"/>' +
         '<circle cx="14.1" cy="8.6" r=".9" fill="#221713" stroke="none"/>' +
         '<path d="M10.1 11.3c1.2 1.2 2.6 1.2 3.8 0" stroke-linecap="round"/></svg>',
    ticket:'<svg viewBox="0 0 24 24" fill="none" stroke="#221713" stroke-width="2.2" stroke-linejoin="round">' +
           '<path d="M3 8.4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.8a1.8 1.8 0 0 0 0 3.6v1.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.8a1.8 1.8 0 0 0 0-3.6z"/>' +
           '<path d="M12 7.6v8.8" stroke-width="2.4" stroke-dasharray="1.8 2.2"/></svg>',
    gift:'<svg viewBox="0 0 24 24" fill="none" stroke="#221713" stroke-width="2.1" stroke-linejoin="round">' +
        '<rect x="3.4" y="9.6" width="17.2" height="10.6" rx="1.8"/>' +
        '<path d="M3.4 13.6h17.2M12 9.6v10.6"/>' +
        '<path d="M12 9.4C10.6 6.4 8.8 5.6 7.9 6.6c-1 1 .1 2.8 4.1 2.8z"/>' +
        '<path d="M12 9.4c1.4-3 3.2-3.8 4.1-2.8 1 1-.1 2.8-4.1 2.8z"/></svg>',
    album:'<svg viewBox="0 0 24 24" fill="none" stroke="#221713" stroke-width="2.1" stroke-linejoin="round">' +
          '<rect x="4.2" y="3.2" width="15.6" height="17.6" rx="2"/>' +
          '<path d="M8.2 3.2v17.6"/>' +
          '<path d="M11.2 8.2h5.4M11.2 12h5.4" stroke-linecap="round"/></svg>'
  };

  function cardOf(id){
    for (var i=0;i<CARDS.length;i++) if (CARDS[i].id === id) return CARDS[i];
    return null;
  }

  function countCards(cards){
    var m = {};
    (cards || []).forEach(function(id){ m[id] = (m[id] || 0) + 1; });
    return m;
  }

  function hasAllSet(cnt){
    var ok = true;
    CARDS.forEach(function(c){
      if (!(cnt[c.id] > 0)) ok = false;
    });
    return ok;
  }

  function hasFullSet(cnt){
    var ok = true;
    CARDS.forEach(function(c){
      if (c.id !== 'E' && !(cnt[c.id] > 0)) ok = false;
    });
    return ok;
  }

  function redeemCount(u, pid){
    return (u.redeems || []).filter(function(r){ return r.pid === pid; }).length;
  }

  function prizeStatus(u, p){
    var cnt = countCards(u.cards);
    var total = (u.cards || []).length;
    if (p.per > 0 && redeemCount(u, p.id) >= p.per) return { ok:false, label:'已兌換' };
    if (p.need === 'all' && !hasAllSet(cnt)) return { ok:false, label:'未集齊' };
    if (p.need === 'full' && !hasFullSet(cnt)) return { ok:false, label:'未集齊' };
    if (p.need === 'hidden' && !(cnt.E > 0)) return { ok:false, label:'未有隱藏款' };
    if (total < p.cost) return { ok:false, label:'印花不足' };
    return { ok:true, label:'兌換' };
  }

  /* 扣卡規劃：先扣重複（同款第 2 張起），仍不足才動單張，由普通到稀有 */
  function planConsume(cards, n){
    var cnt = countCards(cards);
    var order = CARDS.map(function(c){ return c.id; });
    var used = {}, left = n, i, k;

    order.forEach(function(id){
      while (left > 0 && (cnt[id] || 0) > 1){ used[id] = (used[id] || 0) + 1; cnt[id]--; left--; }
    });
    order.forEach(function(id){
      while (left > 0 && (cnt[id] || 0) > 0){ used[id] = (used[id] || 0) + 1; cnt[id]--; left--; }
    });
    if (left > 0) return null;

    var base = countCards(cards), out = [];
    order.forEach(function(id){
      var keep = (base[id] || 0) - (used[id] || 0);
      for (i = 0; i < keep; i++) out.push(id);
    });
    return { used: used, cards: out, base: base };
  }

  function genCode(){
    var A = 'ACDEFGHJKLMNPQRTUVWXY34679', s = '';
    for (var i = 0; i < 8; i++) s += A.charAt(Math.floor(Math.random() * A.length));
    return 'WX-' + s.slice(0, 4) + '-' + s.slice(4);
  }

  function renderRedeem(){
    var users = readUsers(), u = users[currentUser];
    if (!u) return;
    u.redeems = u.redeems || [];

    var cnt = countCards(u.cards), total = (u.cards || []).length, dup = 0;
    for (var k in cnt) if (cnt[k] > 1) dup += cnt[k] - 1;

    wmTotal.textContent = total;
    wmSub.innerHTML = dup > 0
      ? ('其中 <b style="color:#E32412">' + dup + '</b> 張重複<br>可安心拿來兌換')
      : '暫無重複卡<br>兌換會動到卡冊';

    var html = '';
    PRIZES.forEach(function(p){
      var st = prizeStatus(u, p);
      var needTxt = (p.cost > 0 ? ('需 ' + p.cost + ' 張印花') : '免印花') + ' · 不限量';
      if (p.need === 'full') needTxt = '集齊 A–D 四款 · 不限量';
      if (p.need === 'hidden') needTxt = '需持有隱藏款 · 不限量';

      var noteTxt = p.note;
      if (p.need === 'all'){
        var kinds = 0;
        CARDS.forEach(function(c){ if ((cnt[c.id] || 0) > 0) kinds++; });
        noteTxt = '含隱藏款 · 已集 ' + kinds + ' / ' + CARDS.length + ' 款';
      }

      html += '<div class="prize' + (st.ok ? '' : ' off') + '">' +
                '<div class="pico">' + ICON[p.icon] + '</div>' +
                '<div class="pbody">' +
                  '<div class="pname">' + p.name + '</div>' +
                  '<div class="pmeta">' + needTxt + '<br>' + noteTxt + '</div>' +
                '</div>' +
                '<button class="pbtn' + (st.ok ? '' : ' off') + '" data-pid="' + p.id + '"' +
                  (st.ok ? '' : ' disabled') + '>' + st.label + '</button>' +
              '</div>';
    });
    prizeList.innerHTML = html;
  }

  /* ---------- 彈層控制 ---------- */
  function openSheet(el){ el.classList.add('on'); }
  function closeSheet(el){ el.classList.remove('on'); }

  var pendingPrize = null;

  function openConfirm(p){
    var users = readUsers(), u = users[currentUser];
    if (!u) return;
    pendingPrize = p;

    cfSub.innerHTML = '「' + p.name + '」<br>' +
      (p.cost > 0 ? ('將扣除 ' + p.cost + ' 張印花') : '不扣印花，僅核對是否集齊');

    var plan = planConsume(u.cards || [], p.cost);
    if (!plan){
      cfChips.innerHTML = '<span class="chip dim">印花不足</span>';
      cfWarn.style.display = 'none';
      $('btnConfirmRedeem').disabled = true;
      $('btnConfirmRedeem').textContent = '印花不足';
      openSheet(sheetConfirm);
      return;
    }

    var base = countCards(u.cards), chips = '', danger = false, ids = Object.keys(plan.used);
    ids.forEach(function(id){
      var after = (base[id] || 0) - plan.used[id];
      var c = cardOf(id);
      if (after === 0) danger = true;
      chips += '<span class="chip' + (after === 0 ? ' dim' : '') + '">' +
                 (c ? c.name : id) + ' ×' + plan.used[id] +
                 (after === 0 ? '（唯一）' : '') +
               '</span>';
    });
    cfChips.innerHTML = chips || '<span class="chip dim">不需扣卡</span>';

    if (danger){
      cfWarn.style.display = 'block';
      cfWarn.textContent = '注意：標「唯一」的卡會從卡冊移走，該款在卡冊會變回未獲得。';
    } else {
      cfWarn.style.display = 'none';
    }

    $('btnConfirmRedeem').disabled = false;
    $('btnConfirmRedeem').textContent = '確認兌換';
    openSheet(sheetConfirm);
  }

  function openDone(p, code, exp){
    dnSub.innerHTML = '「' + p.name + '」已加入兌換記錄';
    dnCode.textContent = code;
    var d = new Date(exp);
    dnExp.textContent = '兌換碼有效期至 ' + d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
    openSheet(sheetDone);
  }

  function doRedeem(){
    var p = pendingPrize;
    if (!p) return;
    var users = readUsers(), u = users[currentUser];
    if (!u) return;

    if (redeemCount(u, p.id) >= p.per){ closeSheet(sheetConfirm); toast('此獎品已達兌換上限'); renderRedeem(); return; }

    var plan = planConsume(u.cards || [], p.cost);
    if (!plan){ closeSheet(sheetConfirm); toast('印花不足'); renderRedeem(); return; }

    u.cards = plan.cards;
    u.redeems = u.redeems || [];

    var code = genCode(), exp = Date.now() + 30 * 24 * 3600 * 1000;
    u.redeems.push({ pid: p.id, name: p.name, code: code, at: Date.now(), exp: exp, used: false });

    writeUsers(users);
    closeSheet(sheetConfirm);
    openDone(p, code, exp);
    renderRedeem();
    renderMain();
  }

  function openRecords(){
    var users = readUsers(), u = users[currentUser];
    u.redeems = (u && u.redeems) || [];
    if (!u.redeems.length){
      recList.innerHTML = '<div class="emptyrec">還沒有兌換記錄</div>';
    } else {
      var html = '';
      u.redeems.slice().reverse().forEach(function(r){
        var d = new Date(r.at);
        html += '<div class="rec">' +
                  '<div><div class="rn">' + r.name + '</div>' +
                  '<div class="rm">' + d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) +
                    '-' + ('0' + d.getDate()).slice(-2) + ' · 未使用</div></div>' +
                  '<div class="rc">' + r.code + '</div>' +
                '</div>';
      });
      recList.innerHTML = html;
    }
    openSheet(sheetRecords);
  }

  /* ---------- 綁定 ---------- */
  prizeList.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.pbtn') : null;
    if (!b || b.disabled) return;
    var pid = b.getAttribute('data-pid'), p = null;
    PRIZES.forEach(function(x){ if (x.id === pid) p = x; });
    if (p) openConfirm(p);
  });

  $('btnConfirmRedeem').addEventListener('click', doRedeem);
  $('btnCancelRedeem').addEventListener('click', function(){ closeSheet(sheetConfirm); });
  $('btnDoneClose').addEventListener('click', function(){
    closeSheet(sheetDone);
    showScreen(scrMain);
  });
  $('btnRecords').addEventListener('click', openRecords);
  $('btnRecClose').addEventListener('click', function(){ closeSheet(sheetRecords); });

  [sheetConfirm, sheetDone, sheetRecords].forEach(function(sh){
    sh.addEventListener('click', function(e){ if (e.target === sh) closeSheet(sh); });
  });

  /* ================= 主界面動作 ================= */
  $('btnRedeem').addEventListener('click', function(){
    renderRedeem();
    showScreen(scrRedeem);
  });
  $('btnBackRedeem').addEventListener('click', function(){ showScreen(scrMain); });
  $('btnSwap').addEventListener('click', function(){ toast('交換功能即將開放'); });

  /* ================= 登出 ================= */
  btnLogout.addEventListener('click', function(){
    setCur('');
    currentUser = '';
    inPhone.value = '';
    inCode.value = '';
    sent = { phone:'', code:'', exp:0 };
    codeHint.classList.remove('on');
    codeHint.textContent = '';
    clearInterval(coolTimer); coolLeft = 0; setSendBtn();
    clearMsg();
    showScreen(scrAuth);
  });

  /* ================= 啟動 ================= */
  (function boot(){
    var cur = getCur();
    var users = readUsers();
    if (cur && users[cur]){
      currentUser = cur;
      enterMain(false);          // 已登入：恢復會話，不重複發卡
    } else {
      setCur('');
      showScreen(scrAuth);
    }
  })();

})();
</script>
</body>
</html>
